<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錄音室預約系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 95%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* 預約表單樣式 */
        .booking-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 13px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .time-slot {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-slot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .time-slot label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
            font-size: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            margin-top: 5px;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        /* 撞期顯示區域 */
        .conflict-section {
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            border-radius: 6px;
            border: 2px solid #e57373;
            max-height: 200px;
            overflow-y: auto;
        }

        .conflict-section h3 {
            font-size: 14px;
            color: #c62828;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .conflict-item {
            font-size: 12px;
            color: #c62828;
            padding: 6px;
            margin-bottom: 5px;
            background: #ffcdd2;
            border-radius: 4px;
            border-left: 3px solid #d32f2f;
            font-weight: 500;
        }

        /* 月曆樣式 */
        .calendar-section {
            background: white;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: #ecf0f1;
            border-radius: 8px;
        }

        .current-month {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }

        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr) 100px;
            gap: 2px;
            background: #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .day-header {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .day-cell {
            background: white;
            min-height: 200px;
            padding: 8px;
            border: 1px solid #eee;
            position: relative;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 15px;
            font-weight: 900;
        }

        /* 時段表格 */
        .time-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        .time-table td {
            padding: 3px;
            border: 1px solid #e0e0e0;
            font-size: 10px;
            text-align: center;
            height: 25px;
            background: white;
        }

        .time-table .time-label {
            background: #f5f5f5;
            font-weight: bold;
            width: 50px;
            font-size: 9px;
        }
        
        .time-table .time-label.header {
            background: #4B7970;
            color: white;
        }

        .time-table .room-cell {
            width: 25%;
        }

        .time-table .room-cell.booked {
            color: white;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .time-table .room-cell.booked:hover {
            opacity: 0.8;
        }

        .today {
            background: #e8f4f8 !important;
            border: 2px solid #3498db !important;
        }

        .holiday {
            background: #ffcdd2 !important;
        }

        /* 週六欄特殊樣式 */
        .day-cell.saturday {
            min-width: 100px;
            max-width: 120px;
            font-size: 11px;
        }

        .saturday-bookings {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 5px;
        }

        .saturday-booking-item {
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 9px;
            line-height: 1.2;
            word-break: break-word;
            cursor: pointer;
            position: relative;
            font-weight: 500;
        }

        .saturday-booking-item:hover {
            opacity: 0.8;
        }

        .other-month {
            background: #bdbdbd;
            color: #616161;
        }

        .other-month .day-number {
            color: #616161;
        }

        /* 訊息提示 */
        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
            font-size: 12px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .required {
            color: #e74c3c;
        }

        /* 編輯/刪除按鈕 */
        .booking-actions {
            position: absolute;
            top: 2px;
            right: 2px;
            display: none;
            gap: 3px;
        }

        .room-cell.booked:hover .booking-actions {
            display: flex;
        }

        .action-btn {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            color: white;
        }

        .edit-btn {
            background: rgba(52, 152, 219, 0.8);
        }

        .delete-btn {
            background: rgba(231, 76, 60, 0.8);
        }

        /* 重複預約選項 */
        .repeat-options {
            margin-top: 10px;
            padding: 10px;
            background: #e8f4f8;
            border-radius: 6px;
            display: none;
        }

        .repeat-options.show {
            display: block;
        }

        .date-selection-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .date-btn {
            padding: 8px 12px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            min-width: 80px;
        }

        .date-btn:hover {
            background: #e8f4f8;
        }

        .date-btn.selected {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .date-btn.holiday {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .date-btn.holiday.selected {
            background: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
    </style>
    <!-- InstantDB SDK - 使用 ES Module 方式載入 -->
    <script type="module">
        // 動態載入 InstantDB Core SDK（使用 esm.sh CDN）
        import { init, id, i } from 'https://esm.sh/@instantdb/core@latest';
        
        // 定義 Schema（根據您的需求）
        const schema = i.schema({
            entities: {
                "$files": i.entity({
                    "path": i.string().unique().indexed(),
                    "url": i.string().optional(),
                }),
                "$users": i.entity({
                    "email": i.string().unique().indexed().optional(),
                    "imageURL": i.string().optional(),
                    "type": i.string().optional(),
                }),
                // 錄音室預訂資料
                "REC_RESERVE_DB": i.entity({
                    "program": i.string(),
                    "date": i.string().indexed(),
                    "room": i.string(),
                    "time": i.string(),
                    "operator": i.string(),
                    "memo": i.string().optional(),
                    "recorder": i.string().optional(),
                    "isRepeat": i.boolean(),
                    "weekday": i.number().optional(),
                    "groupId": i.string().optional(),
                    "createdAt": i.string(),
                }),
                // 香港公眾假期
                "HK_PUB_HOLIDAY": i.entity({
                    "name": i.string(),
                    "date": i.string().indexed(),
                }),
            },
            links: {
                "$usersLinkedPrimaryUser": {
                    "forward": {
                        "on": "$users",
                        "has": "one",
                        "label": "linkedPrimaryUser",
                        "onDelete": "cascade"
                    },
                    "reverse": {
                        "on": "$users",
                        "has": "many",
                        "label": "linkedGuestUsers"
                    }
                }
            },
            rooms: {}
        });
        
        // 將 InstantDB 暴露到全局
        window.InstantDB = { init, id, schema };
        console.log('✅ InstantDB SDK 已載入');
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ 錄音室預約系統</h1>
            <p>歡迎使用錄音室預約系統，請填寫以下表單進行預約</p>
        </div>

        <div class="main-content">
            <!-- 預約表單 -->
            <div class="booking-form">
                <h2 style="margin-bottom: 15px; color: #2c3e50; font-size: 18px;">新增預約</h2>
                
                <div id="alert-container"></div>

                <form id="bookingForm">
                    <input type="hidden" id="editingId" value="">
                    
                    <div class="form-group">
                        <label>節目名稱 <span class="required">*</span></label>
                        <div style="display: flex; gap: 5px; align-items: stretch;">
                            <input type="text" id="program" name="program" required placeholder="例如：FH, DY" style="flex: 1;" oninput="updateProgramColorPreview()">
                            <div id="programColorPreview" style="width: 40px; border: 2px solid #ddd; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; cursor: help;" title="節目顯示顏色"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>預約類型</label>
                        <select id="bookingType" name="bookingType" onchange="toggleRepeatOptions()">
                            <option value="single">單次預約</option>
                            <option value="repeat">每週重複</option>
                        </select>
                    </div>

                    <div class="form-group" id="singleDateGroup">
                        <label>預約日期 <span class="required">*</span></label>
                        <input type="date" id="bookingDate" name="bookingDate" required>
                    </div>

                    <div class="form-group" id="repeatGroup" style="display: none;">
                        <label>每週 <span class="required">*</span></label>
                        <select id="weekday" name="weekday">
                            <option value="">請選擇</option>
                            <option value="1">星期一</option>
                            <option value="2">星期二</option>
                            <option value="3">星期三</option>
                            <option value="4">星期四</option>
                            <option value="5">星期五</option>
                            <option value="6">星期六</option>
                        </select>
                    </div>

                    <div class="repeat-options" id="repeatOptions">
                        <div class="form-group">
                            <label>選擇日期 <span class="required">*</span></label>
                            <div id="dateSelectionContainer" class="date-selection-buttons">
                                <p style="font-size: 12px; color: #7f8c8d;">請先選擇「每週」的星期</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>錄音室 <span class="required">*</span></label>
                        <select id="room" name="room" required>
                            <option value="">請選擇</option>
                            <option value="A">A室</option>
                            <option value="B">B室</option>
                            <option value="C">C室</option>
                            <option value="D">D室</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>時段 <span class="required">*</span></label>
                        <div class="time-slots">
                            <div class="time-slot">
                                <input type="checkbox" id="time0900" name="time" value="0900">
                                <label for="time0900">09:00</label>
                            </div>
                            <div class="time-slot">
                                <input type="checkbox" id="time1030" name="time" value="1030">
                                <label for="time1030">10:30</label>
                            </div>
                            <div class="time-slot">
                                <input type="checkbox" id="time1300" name="time" value="1300">
                                <label for="time1300">13:00</label>
                            </div>
                            <div class="time-slot">
                                <input type="checkbox" id="time1530" name="time" value="1530">
                                <label for="time1530">15:30</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>音控員 <span class="required">*</span></label>
                        <input type="text" id="operator" name="operator" required placeholder="音控員姓名或簡稱">
                    </div>

                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="memo" name="memo" rows="2" placeholder="特殊需求或備註（選填）"></textarea>
                    </div>

                    <div class="form-group">
                        <label>記錄者</label>
                        <input type="text" id="recorder" name="recorder" placeholder="您的姓名或簡稱">
                    </div>

                    <button type="submit" class="btn" id="submitBtn">提交預約</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()" style="display: none;" id="cancelBtn">取消編輯</button>
                </form>

                <!-- 撞期顯示區域 -->
                <div class="conflict-section" id="conflictSection" style="display: none;">
                    <h3>⚠️ 撞期提示</h3>
                    <div id="conflictList"></div>
                </div>
            </div>

            <!-- 月曆顯示 -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="current-month" id="current-month"></div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <label for="monthSelector" style="font-size: 14px; color: #2c3e50;">選擇月份：</label>
                            <input type="month" id="monthSelector" style="padding: 8px; border: 2px solid #3498db; border-radius: 6px; font-size: 14px; cursor: pointer;" onchange="changeMonth()" disabled>
                            <button type="button" id="monthLockBtn" onclick="toggleMonthLock()" style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">🔒 解鎖</button>
                            <button type="button" onclick="reloadBookings()" style="padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;" title="重新載入所有預約資料">🔄 重新載入</button>
                            <div id="monthPasswordContainer" style="display: none; align-items: center; gap: 5px;">
                                <input type="password" id="monthPassword" placeholder="輸入密碼" style="padding: 6px; border: 2px solid #3498db; border-radius: 4px; font-size: 12px; width: 120px;" onkeypress="if(event.key==='Enter') unlockMonth()">
                                <button type="button" onclick="unlockMonth()" style="padding: 6px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">確認</button>
                                <button type="button" onclick="cancelUnlock()" style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">取消</button>
                            </div>
                        </div>
                    </div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #e74c3c;"></div>
                            <span>A室</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #f39c12;"></div>
                            <span>B室</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #27ae60;"></div>
                            <span>C室</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #8e44ad;"></div>
                            <span>D室</span>
                        </div>
                    </div>
                </div>

                <div class="calendar-grid" id="calendar-grid">
                    <!-- 動態生成月曆 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 資料儲存
        const STORAGE_KEY = 'recording_studio_bookings'; // 保留作為備用快取
        const TIME_SLOTS = ['0900', '1030', '1300', '1530'];
        const ROOMS = ['A', 'B', 'C', 'D'];
        
        // ============================================
        // InstantDB 設定
        // ============================================
        const INSTANTDB_APP_ID = 'd57ba3c8-bc1b-461d-b4e4-b9f4e75065c5';
        const INSTANTDB_ENABLED = true; // ⬅️ 設為 true 啟用 InstantDB
        
        // InstantDB 初始化
        let db = null;
        
        // InstantDB 資料快取（用於 subscribeQuery）
        let instantDBBookings = [];
        let instantDBHolidays = [];
        
        // 等待 InstantDB SDK 載入並初始化
        let initAttempts = 0;
        const MAX_INIT_ATTEMPTS = 50; // 最多嘗試 5 秒（50 * 100ms）
        
        function initInstantDB() {
            if (!INSTANTDB_ENABLED) {
                console.log('ℹ️ InstantDB 已停用，使用 localStorage');
                return;
            }
            
            initAttempts++;
            
            // 檢查 InstantDB 是否已載入
            if (typeof window !== 'undefined' && window.InstantDB && window.InstantDB.init) {
                try {
                    db = window.InstantDB.init({ 
                        appId: INSTANTDB_APP_ID,
                        schema: window.InstantDB.schema
                    });
                    console.log('✅ InstantDB 初始化成功');
                    console.log('✅ db 物件:', db);
                    console.log('✅ db 可用方法:', Object.keys(db || {}));
                    
                    // 訂閱預約資料（根據 InstantDB 範例，使用 subscribeQuery）
                    if (db.subscribeQuery) {
                        db.subscribeQuery({ REC_RESERVE_DB: {} }, (resp) => {
                            if (resp.error) {
                                console.error('❌ InstantDB 訂閱預約資料錯誤:', resp.error.message);
                                return;
                            }
                            if (resp.data) {
                                instantDBBookings = resp.data.REC_RESERVE_DB || [];
                                console.log('✅ InstantDB 預約資料已更新:', instantDBBookings.length, '筆');
                                // 更新 localStorage 作為備用
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(instantDBBookings));
                                // 重新生成日曆
                                if (document.querySelector('.calendar-grid')) {
                                    generateCalendar();
                                }
                            }
                        });
                        
                        // 訂閱假期資料
                        db.subscribeQuery({ HK_PUB_HOLIDAY: {} }, (resp) => {
                            if (resp.error) {
                                console.error('❌ InstantDB 訂閱假期資料錯誤:', resp.error.message);
                                return;
                            }
                            if (resp.data) {
                                const holidays = resp.data.HK_PUB_HOLIDAY || [];
                                instantDBHolidays = holidays.map(item => {
                                    if (item.date) {
                                        if (typeof item.date === 'string' && item.date.includes('T')) {
                                            return item.date.split('T')[0];
                                        } else if (typeof item.date === 'string') {
                                            const dateMatch = item.date.match(/^(\d{4}-\d{2}-\d{2})/);
                                            return dateMatch ? dateMatch[1] : item.date;
                                        }
                                    }
                                    return null;
                                }).filter(date => date);
                                HK_HOLIDAYS = instantDBHolidays;
                                console.log('✅ InstantDB 假期資料已更新:', HK_HOLIDAYS.length, '個假期');
                                // 更新 localStorage 作為備用
                                localStorage.setItem(HOLIDAYS_STORAGE_KEY, JSON.stringify({
                                    holidays: HK_HOLIDAYS,
                                    timestamp: Date.now()
                                }));
                                // 重新生成日曆
                                if (document.querySelector('.calendar-grid')) {
                                    generateCalendar();
                                }
                            }
                        });
                    }
                } catch (error) {

        // 取得或設定節目顏色

            if (!program || program.trim() === '') {
                return '#f5f5f5';
            }
            
            // 維修保養使用特殊顏色
            if (program === '維修保養') {
                return '#4C8DDC';
            }
            
            // 從 localStorage 讀取節目顏色對應
            const colorMap = JSON.parse(localStorage.getItem(PROGRAM_COLOR_STORAGE_KEY) || '{}');
            
            if (colorMap[program]) {
                return colorMap[program];
            }
            
            // 如果沒有，分配新顏色
            const programs = Object.keys(colorMap);
            const usedColors = Object.values(colorMap);
            let newColor = PROGRAM_COLORS.find(c => !usedColors.includes(c));
            
            if (!newColor) {
                // 如果所有顏色都用完，循環使用
                newColor = PROGRAM_COLORS[programs.length % PROGRAM_COLORS.length];
            }
            
            // 儲存新顏色
            colorMap[program] = newColor;
            localStorage.setItem(PROGRAM_COLOR_STORAGE_KEY, JSON.stringify(colorMap));
            
            return newColor;
        }

        // 新增預約（異步）
        // skipReload: 如果為 true，則不立即重新載入資料（用於批量新增）
        async function addBooking(booking, isRepeat = false, weekday = null, groupId = null, skipReload = false) {
            // 生成唯一 ID（使用時間戳 + 隨機數 + 計數器）
            const uniqueId = Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9) + '-' + performance.now().toString().replace('.', '');
            const newBooking = {
                id: uniqueId,
                ...booking,
                isRepeat: isRepeat,
                weekday: weekday,
                groupId: groupId || (isRepeat ? Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9) : null),
                createdAt: new Date().toISOString()
            };
            
            console.log('準備新增預約:', newBooking);
            
            // 如果使用 InstantDB
            if (typeof INSTANTDB_ENABLED !== 'undefined' && INSTANTDB_ENABLED && db) {
                try {
                    // 使用 InstantDB 的實際 API（根據範例）
                    // 注意：InstantDB 會自動生成 ID，但我們保留自定義 ID 以保持兼容性
                    const bookingData = {
                        ...booking,
                        isRepeat: isRepeat || false,
                        // 確保 weekday 是 number 類型，如果是 null 則不包含此欄位
                        ...(weekday !== null && weekday !== undefined ? { weekday: Number(weekday) } : {}),
                        // 確保 groupId 是 string 或 null
                        groupId: groupId || (isRepeat ? Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9) : null),
                        createdAt: new Date().toISOString()
                    };
                    
                    // 使用 db.tx 構建交易（根據 InstantDB 範例）
                    db.transact(
                        db.tx.REC_RESERVE_DB[window.InstantDB.id()].update(bookingData)
                    );
                    
                    console.log('✅ 預約已成功寫入 InstantDB');
                    
                    // 定期清理舊資料（每10次新增清理一次）

        // 檢查撞期（異步）
        async function checkConflict(newBooking, excludeId = null) {
            const bookings = await getBookings();
            const conflicts = bookings.filter(booking => {
                if (excludeId && booking.id === excludeId) return false;
                // 如果是同組的預約，不算撞期
                if (newBooking.groupId && booking.groupId === newBooking.groupId) return false;
                return booking.date === newBooking.date &&
                       booking.room === newBooking.room &&
                       booking.time === newBooking.time;
            });
            return conflicts;
        }

        // 更新撞期顯示
        async function updateConflictDisplay() {
            const formData = new FormData(document.getElementById('bookingForm'));
            const bookingType = formData.get('bookingType');
            const room = formData.get('room');
            const times = formData.getAll('time');
            const editingId = document.getElementById('editingId').value;

            if (!room || times.length === 0) {
                document.getElementById('conflictSection').style.display = 'none';
                return;
            }

            let dates = [];
            if (bookingType === 'repeat') {
                dates = getSelectedDates();
            } else {
                const date = formData.get('bookingDate');
                if (date) dates = [date];
            }

            if (dates.length === 0) {
                document.getElementById('conflictSection').style.display = 'none';
                return;
            }

            // 如果是編輯模式，需要排除整個組的預約
            let excludeGroupId = null;
            if (editingId) {
                const bookings = await getBookings();
                const editingBooking = bookings.find(b => b.id === editingId);
                if (editingBooking && editingBooking.isRepeat && editingBooking.groupId) {
                    excludeGroupId = editingBooking.groupId;
                }
            }

            const conflicts = [];
            for (const date of dates) {
                for (const time of times) {
                    const booking = { date, room, time };
                    // 檢查撞期，排除正在編輯的預約和其組內其他預約
                    const conflictList = await checkConflict(booking, editingId || null);
                    conflictList.forEach(c => {
                        // 如果是同組的預約，不算撞期
                        if (excludeGroupId && c.groupId === excludeGroupId) {
                            return;
                        }
                        conflicts.push({
                            date: c.date,
                            room: c.room,
                            time: c.time,
                            program: c.program
                        });
                    });
                }
            }

            const conflictSection = document.getElementById('conflictSection');
            const conflictList = document.getElementById('conflictList');
            
            if (conflicts.length > 0) {
                conflictSection.style.display = 'block';
                conflictList.innerHTML = conflicts.map(c => 
                    `<div class="conflict-item">${c.date} ${c.room}室 ${c.time} 已被 ${c.program} 預約</div>`
                ).join('');
            } else {
                conflictSection.style.display = 'none';
            }
        }

        // 生成日期選擇按鈕
        function generateDateButtons() {
            const weekday = document.getElementById('weekday').value;
            if (!weekday) {
                clearDateButtons();
                return;
            }

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const targetWeekday = parseInt(weekday); // 1=星期一, 2=星期二, ..., 6=星期六
            
            // 直接遍歷該月所有日期，找出所有符合目標星期幾的日期
            const dates = [];
            for (let day = 1; day <= lastDay; day++) {
                const date = new Date(year, month, day);
                const dayOfWeek = date.getDay(); // 0=星期日, 1=星期一, ..., 6=星期六
                if (dayOfWeek === targetWeekday) {
                    dates.push(date);
                }
            }

            const container = document.getElementById('dateSelectionContainer');
            container.innerHTML = '';

            if (dates.length === 0) {
                container.innerHTML = '<p style="font-size: 12px; color: #7f8c8d;">該月沒有對應的日期</p>';
                return;
            }

            dates.forEach(date => {
                const dateStr = formatDate(date);
                const isHoliday = HK_HOLIDAYS.includes(dateStr);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `date-btn ${isHoliday ? 'holiday' : ''}`;
                btn.dataset.date = dateStr;
                btn.textContent = `${date.getMonth() + 1}/${date.getDate()}`;
                btn.onclick = function() {
                    this.classList.toggle('selected');
                    updateConflictDisplay();
                };
                container.appendChild(btn);
            });
        }

            if (!isMonthUnlocked) {
                showAlert('請先解鎖月份選擇功能', 'warning');
                updateMonthSelector(); // 恢復原值
                return;
            }
            
            const monthValue = document.getElementById('monthSelector').value;
            if (monthValue) {
                const [year, month] = monthValue.split('-');
                currentDate = new Date(parseInt(year), parseInt(month) - 1, 1);
                // 保存選擇的月份
                localStorage.setItem(MONTH_STORAGE_KEY, monthValue);
                await generateCalendar();
                // 更新表單預設日期為新月份
                updateDefaultBookingDate();
                // 重新生成日期按鈕（如果是每週重複模式）
                const bookingType = document.getElementById('bookingType').value;
                if (bookingType === 'repeat') {
                    generateDateButtons();
                }
                showAlert(`已切換到 ${year}年${parseInt(month)}月`, 'success');
            }
        }

        async function generateCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            // 找到第一個星期一
            let startDate = new Date(firstDay);
            const firstDayOfWeek = firstDay.getDay();
            const daysToMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
            startDate.setDate(startDate.getDate() - daysToMonday);
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            // 星期標題（週一到週六）
            const weekdays = ['一', '二', '三', '四', '五', '六'];
            weekdays.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                grid.appendChild(header);
            });
            
            // 生成日期（6週 x 6天 = 36天）
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const bookings = await getBookings();
            console.log('generateCalendar: 載入預約資料', bookings.length, '筆');
            if (bookings.length > 0) {
                console.log('generateCalendar: 前3筆預約詳情:', bookings.slice(0, 3).map(b => ({ 
                    date: b.date, 
                    program: b.program, 
                    room: b.room, 
                    time: b.time,
                    dateType: typeof b.date,
                    timeType: typeof b.time,
                    dateLength: String(b.date).length
                })));
                console.log('generateCalendar: 當前顯示月份:', year, '年', month + 1, '月');
                
                // 檢查 2026-01-04 的所有預約
                const jan4Bookings = bookings.filter(b => {
                    const bookingDate = b.date ? String(b.date).trim() : '';
                    return bookingDate === '2026-01-04' || bookingDate.startsWith('2026-01-04');
                });
                if (jan4Bookings.length > 0) {
                    console.log('🔍 2026-01-04 的所有預約:', jan4Bookings.map(b => ({
                        id: b.id,

                        time: b.time,

                        program: b.program

                }
            } else {
                console.warn('⚠️ generateCalendar: 沒有載入到任何預約資料！');
            }
            
            for (let week = 0; week < 6; week++) {

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }


        // 表單提交（異步）
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const bookingType = formData.get('bookingType');
            const times = formData.getAll('time');
            const editingId = document.getElementById('editingId').value;
            
            if (times.length === 0) {
                showAlert('請至少選擇一個時段', 'danger');
                return;
            }
            
            const program = formData.get('program');
            const room = formData.get('room');
            const operator = formData.get('operator');
            const memo = formData.get('memo') || '';
            const recorder = formData.get('recorder') || '';
            
            let dates = [];
            
            if (bookingType === 'repeat') {
                const weekday = formData.get('weekday');
                if (!weekday) {
                    showAlert('請選擇每週的星期', 'danger');
                    return;
                }
                
                dates = getSelectedDates();
                if (dates.length === 0) {
                    showAlert('請至少選擇一個日期', 'danger');
                    return;
                }
            } else {
                const date = formData.get('bookingDate');
                if (!date) {
                    showAlert('請選擇預約日期', 'danger');
                    return;
                }
                dates = [date];
            }
            
            let hasConflict = false;
            const conflictMessages = [];
            let successCount = 0;
            
            // 處理更新模式
            let groupId = null;
            if (editingId) {
                const bookings = await getBookings();
                const editingBooking = bookings.find(b => b.id === editingId);
                if (editingBooking) {
                    // 如果是每週重複預約，需要處理整個組
                    if (editingBooking.isRepeat && editingBooking.groupId) {
                        if (bookingType === 'repeat') {
                            // 更新每週重複：刪除舊組，建立新組
                            groupId = editingBooking.groupId;
                            const oldGroupBookings = bookings.filter(b => b.groupId === groupId);
                            for (const b of oldGroupBookings) {
                                await deleteBooking(b.id);
                            }
                        } else {
                            // 改為單次預約：刪除整個組，只保留一個
                            const oldGroupBookings = bookings.filter(b => b.groupId === editingBooking.groupId);
                            for (const b of oldGroupBookings) {
                                await deleteBooking(b.id);
                            }
                        }
                    } else {
                        // 單次預約更新：先刪除舊的
                        await deleteBooking(editingId);
                    }
                }
            }
            
            // 如果是每週重複模式，生成新的 groupId
            if (bookingType === 'repeat' && !groupId) {
                groupId = Date.now().toString();
            }
            
            // 先檢查所有撞期
            for (const date of dates) {
                for (const time of times) {
                    const booking = {
                        program,
                        date,
                        room,
                        time,
                        operator,
                        memo,
                        recorder
                    };
                    
                    // 檢查撞期（排除正在編輯的預約）
                    const conflicts = await checkConflict(booking, editingId || null);
                    
                    if (conflicts.length > 0) {
                        hasConflict = true;
                        conflicts.forEach(conflict => {
                            conflictMessages.push(`${date} ${room}室 ${time} 時段已有預約（${conflict.program}）`);
                        });
                    }
                }
            }
            
            // 如果沒有撞期，才進行新增
            if (!hasConflict) {
                // 先批量新增所有預約（不立即重新載入）
                const bookingsToAdd = [];
                for (const date of dates) {
                    for (const time of times) {
                        const booking = {
                            program,
                            date,
                            room,
                            time,
                            operator,
                            memo,
                            recorder
                        };
                        
                        const isRepeat = bookingType === 'repeat';
                        const weekday = isRepeat ? formData.get('weekday') : null;
                        bookingsToAdd.push({ booking, isRepeat, weekday, groupId });
                    }
                }
                
                // 批量新增所有預約
                for (const item of bookingsToAdd) {
                    await addBooking(item.booking, item.isRepeat, item.weekday, item.groupId, true); // 傳入 true 表示不立即重新載入
                    successCount++;
                }
                
                // 所有預約都寫入後，一次性清除快取並重新載入
                clearBookingsCache();
                
                // 如果使用 localStorage，不需要等待；如果使用 Google Sheets API，需要等待寫入完成
                if (BOOKINGS_API_URL) {
                    console.log('等待 Google Sheets 完成寫入...');
                    await new Promise(resolve => setTimeout(resolve, 3000)); // 等待 Google Sheets 完成所有寫入
                } else {
                    console.log('使用 localStorage，立即重新載入資料...');
                }
                
                console.log('開始重新載入所有預約資料...');
                // 再次清除快取，確保強制重新讀取
                clearBookingsCache();
                const allBookings = await getBookings();
                console.log('重新載入完成，共', allBookings.length, '筆預約');
                if (allBookings.length > 0) {
                    console.log('前3筆預約範例:', allBookings.slice(0, 3));
                }
                // 確保 localStorage 同步（即使使用 API，也作為備份）
                localStorage.setItem(STORAGE_KEY, JSON.stringify(allBookings));
            }
            
            if (hasConflict && successCount === 0) {
                showAlert('所有時段都發生撞期：\n' + conflictMessages.join('\n'), 'warning');
            } else if (hasConflict) {
                showAlert(`部分預約成功（${successCount}個），部分時段發生撞期`, 'warning');
            } else {
                showAlert(editingId ? '預約已更新！' : `預約成功！已建立 ${successCount} 個預約`, 'success');
                resetForm();
            }
            
            // 在生成日曆前，再次清除快取確保使用最新資料
            clearBookingsCache();
            console.log('準備重新生成日曆...');
            await generateCalendar();
            console.log('日曆重新生成完成');
            updateConflictDisplay();
        });

        // 監聽表單變更以更新撞期顯示
        ['bookingDate', 'room'].forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener('change', updateConflictDisplay);
            }
        });

        document.querySelectorAll('input[name="time"]').forEach(checkbox => {
            checkbox.addEventListener('change', updateConflictDisplay);
        });

        // 監聽日期按鈕選擇變化
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('date-btn')) {
                updateConflictDisplay();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 載入保存的月份（必須先載入，才能知道要顯示哪個月份）
            loadSavedMonth();
            
            // 根據當前顯示的月份設定預設日期
            updateDefaultBookingDate();
            
            // 檢查月份解鎖狀態
            checkMonthUnlock();
            
            // 強制清除快取，確保載入最新資料
            clearBookingsCache();
            console.log('初始化：清除快取，準備載入所有預約資料');
            
            // 載入假期資料（異步，不阻塞月曆生成）
            loadHolidaysFromSheet().then(async () => {
                // 如果月曆已經生成，重新生成以顯示假期
                if (document.querySelector('.calendar-grid')) {
                    await generateCalendar();
                }
            });
            
            // 生成日曆（會自動從 API 載入所有預約資料）
            await generateCalendar();
            
            // 測試：檢查預約格式（僅用於調試）
            const testBookings = await getBookings();
            const jan4Test = testBookings.filter(b => {
                const d = b.date ? String(b.date) : '';
                return d.includes('2026-01-04') || d === '2026-01-04';
            });
            if (jan4Test.length > 0) {
                console.log('🧪 測試：2026-01-04 的預約格式:', jan4Test.map(b => ({
                    date: b.date,
                    dateType: typeof b.date,
                    time: b.time,
                    timeType: typeof b.time,
                    room: b.room,
                    program: b.program
                })));
            }
            
            // 監聽星期選擇變化
            document.getElementById('weekday').addEventListener('change', generateDateButtons);
            
            // 監聽節目名稱輸入變化
            document.getElementById('program').addEventListener('input', updateProgramColorPreview);
            
            // 測試 InstantDB 連線（僅用於調試）
            if (INSTANTDB_ENABLED && db) {
                console.log('🧪 測試 InstantDB 連線...');
                console.log('🧪 db 物件:', db);
                console.log('🧪 db 可用方法:', Object.keys(db));
                
                // 測試查詢
                setTimeout(async () => {
                    try {
                        if (db.query) {
                            const testResult = await db.query({ REC_RESERVE_DB: {} });
                            console.log('🧪 測試查詢結果:', testResult);
                        } else if (db.useQuery) {
                            const { data } = db.useQuery({ REC_RESERVE_DB: {} });
                            console.log('🧪 測試 useQuery 結果:', data);
                        } else {
                            console.warn('🧪 InstantDB query API 未找到，可能需要調整');
                        }
                    } catch (error) {
                        console.error('🧪 InstantDB 測試查詢失敗:', error);
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
