<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錄音室預約系統</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft JhengHei','微軟正黑體', Arial, sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 95%; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; }
    .header { background: linear-gradient(135deg,#2c3e50 0%,#34495e 100%); color: white; padding: 25px; text-align: center; }
    .header h1 { font-size: 2.2em; margin-bottom: 8px; }
    .main-content { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }
    .booking-form { background: #f8f9fa; padding: 20px; border-radius: 8px; height: fit-content; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #2c3e50; font-size: 13px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px; transition: border-color 0.3s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3498db; }
    .time-slots { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 6px; }
    .time-slot { display: flex; align-items: center; gap: 6px; }
    .time-slot input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .time-slot label { margin: 0; font-weight: normal; cursor: pointer; font-size: 12px; }
    .btn { background: linear-gradient(135deg,#3498db 0%,#2980b9 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52,152,219,0.4); }
    .btn-secondary { background: #95a5a6; margin-top: 5px; }
    .btn-secondary:hover { background: #7f8c8d; }
    .conflict-section { margin-top: 20px; padding: 15px; background: #ffebee; border-radius: 6px; border: 2px solid #e57373; max-height: 200px; overflow-y: auto; }
    .conflict-section h3 { font-size: 14px; color: #c62828; margin-bottom: 10px; font-weight: bold; }
    .conflict-item { font-size: 12px; color: #c62828; padding: 6px; margin-bottom: 5px; background: #ffcdd2; border-radius: 4px; border-left: 3px solid #d32f2f; font-weight: 500; }
    .calendar-section { background: white; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px 20px; background: #ecf0f1; border-radius: 8px; }
    .current-month { font-size: 22px; font-weight: bold; color: #2c3e50; }
    .legend { display: flex; gap: 15px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-color { width: 18px; height: 18px; border-radius: 4px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(5,1fr) 100px; gap: 2px; background: #ddd; border-radius: 8px; overflow: hidden; }
    .day-header { background: #34495e; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; }
    .day-cell { background: white; min-height: 200px; padding: 8px; border: 1px solid #eee; position: relative; }
    .day-number { font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 15px; font-weight: 900; }
    .time-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .time-table td { padding: 3px; border: 1px solid #e0e0e0; font-size: 10px; text-align: center; height: 25px; background: white; }
    .time-table .time-label { background: #f5f5f5; font-weight: bold; width: 50px; font-size: 9px; }
    .time-table .time-label.header { background: #4B7970; color: white; }
    .time-table .room-cell { width: 25%; }
    .time-table .room-cell.booked { color: white; font-weight: bold; cursor: pointer; position: relative; }
    .time-table .room-cell.booked:hover { opacity: 0.8; }
    .today { background: #e8f4f8 !important; border: 2px solid #3498db !important; }
    .holiday { background: #e96359 !important; }
    .day-cell.saturday { min-width: 100px; max-width: 120px; font-size: 11px; }
    .saturday-bookings { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
    .saturday-booking-item { padding: 3px 5px; border-radius: 3px; font-size: 9px; line-height: 1.2; word-break: break-word; cursor: pointer; position: relative; font-weight: 500; }
    .saturday-booking-item:hover { opacity: 0.8; }
    .other-month { background: #bdbdbd; color: #616161; }
    .other-month .day-number { color: #616161; }
    .alert { padding: 12px; margin-bottom: 15px; border-radius: 6px; display: none; font-size: 12px; }
    .alert.show { display: block; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    .required { color: #e74c3c; }
    .booking-actions { position: absolute; top: 2px; right: 2px; display: none; gap: 3px; }
    .room-cell.booked:hover .booking-actions { display: flex; }
    .action-btn { width: 16px; height: 16px; border: none; border-radius: 50%; cursor: pointer; font-size: 11px; line-height: 1; color: white; }
    .edit-btn { background: rgba(52,152,219,0.8); }
    .delete-btn { background: rgba(231,76,60,0.8); }
    .repeat-options { margin-top: 10px; padding: 10px; background: #e8f4f8; border-radius: 6px; display: none; }
    .repeat-options.show { display: block; }
    .date-selection-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .date-btn { padding: 8px 12px; border: 2px solid #3498db; background: white; color: #3498db; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; min-width: 80px; }
    .date-btn:hover { background: #e8f4f8; }
    .date-btn.selected { background: #3498db; color: white; border-color: #2980b9; }
    .date-btn.holiday { border-color: #e74c3c; color: #e74c3c; }
    .date-btn.holiday.selected { background: #e74c3c; color: white; border-color: #c0392b; }
    /* 行動版簡易調整 */
    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
      .booking-form { position: relative; top: 0; max-height: none; }
      .calendar-grid { grid-template-columns: repeat(3, 1fr) 100px; }
    }
    @media (max-width: 600px) {
      .calendar-grid { grid-template-columns: repeat(2, 1fr) 100px; }
      .day-cell { min-height: 160px; }
      .time-table td { font-size: 9px; }
    }
  </style>

  <!-- Supabase 初始化 -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabaseUrl = 'https://wtaofetykradaltunokk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0YW9mZXR5a3JhZGFsdHVub2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5ODU2ODUsImV4cCI6MjA4MDU2MTY4NX0.UFi5I6JYygdhwJXbkBkBFHVlAi8LUVukyZ1uV30JdTw'; // anon key

    const supabase = createClient(supabaseUrl, supabaseKey);

    const supabaseApi = {
      async fetchBookings() {
        const cutoff = new Date();
        cutoff.setMonth(cutoff.getMonth() - 2);
        const cutoffStr = cutoff.toISOString().slice(0, 10);
        const { data, error } = await supabase
          .from('REC_RESERVE_DB')
          .select('*')
          .gte('date', cutoffStr)
          .order('date', { ascending: true })
          .order('time', { ascending: true });
        if (error) { console.error('fetch bookings error', error); return []; }
        return (data || []).map(b => ({
          ...b,
          date: (b.date || '').slice(0, 10),
          time: (b.time || '').toString().padStart(4, '0'),
        }));
      },
      async upsertBooking(row) {
        const { error } = await supabase.from('REC_RESERVE_DB').upsert(row);
        if (error) throw error;
      },
      async deleteBooking(id) {
        const { error } = await supabase.from('REC_RESERVE_DB').delete().eq('id', id);
        if (error) throw error;
      },
      async deleteGroup(groupId) {
        const { error } = await supabase.from('REC_RESERVE_DB').delete().eq('groupId', groupId);
        if (error) throw error;
      },
      async fetchHolidays() {
        const { data, error } = await supabase
          .from('HK_PUB_HOLIDAY')
          .select('*')
          .order('date', { ascending: true });
        if (error) { console.error('fetch holidays error', error); return []; }
        return (data || []).map(h => (h.date || '').slice(0, 10));
      },
    };
    window.supabaseApi = supabaseApi;
  </script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🎙️ 錄音室預約系統</h1>
      <p>歡迎使用錄音室預約系統，請填寫以下表單進行預約</p>
    </div>

    <div class="main-content">
      <!-- 預約表單 -->
      <div class="booking-form">
        <h2 style="margin-bottom: 15px; color: #2c3e50; font-size: 18px;">新增預約</h2>
        <div id="alert-container"></div>
        <form id="bookingForm">
          <input type="hidden" id="editingId" value="">
          <div class="form-group">
            <label>節目名稱 <span class="required">*</span></label>
            <div style="display: flex; gap: 5px; align-items: stretch;">
              <input type="text" id="program" name="program" required placeholder="例如：FH, DY" style="flex: 1;" oninput="updateProgramColorPreview()">
              <div id="programColorPreview" style="width: 40px; border: 2px solid #ddd; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; cursor: help;" title="節目顯示顏色"></div>
            </div>
          </div>

          <div class="form-group">
            <label>預約類型</label>
            <select id="bookingType" name="bookingType" onchange="toggleRepeatOptions()">
              <option value="single">單次預約</option>
              <option value="repeat">每週重複</option>
            </select>
          </div>

          <div class="form-group" id="singleDateGroup">
            <label>預約日期 <span class="required">*</span></label>
            <input type="date" id="bookingDate" name="bookingDate" required>
          </div>

          <div class="form-group" id="repeatGroup" style="display: none;">
            <label>每週 <span class="required">*</span></label>
            <select id="weekday" name="weekday">
              <option value="">請選擇</option>
              <option value="1">星期一</option>
              <option value="2">星期二</option>
              <option value="3">星期三</option>
              <option value="4">星期四</option>
              <option value="5">星期五</option>
              <option value="6">星期六</option>
            </select>
          </div>

          <div class="repeat-options" id="repeatOptions">
            <div class="form-group">
              <label>選擇日期 <span class="required">*</span></label>
              <div id="dateSelectionContainer" class="date-selection-buttons">
                <p style="font-size: 12px; color: #7f8c8d;">請先選擇「每週」的星期</p>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>錄音室 <span class="required">*</span></label>
            <select id="room" name="room" required>
              <option value="">請選擇</option>
              <option value="A">A室</option>
              <option value="B">B室</option>
              <option value="C">C室</option>
              <option value="D">D室</option>
            </select>
          </div>

          <div class="form-group">
            <label>時段 <span class="required">*</span></label>
            <div class="time-slots">
              <div class="time-slot">
                <input type="checkbox" id="time0900" name="time" value="0900"><label for="time0900">09:00</label>
              </div>
              <div class="time-slot">
                <input type="checkbox" id="time1030" name="time" value="1030"><label for="time1030">10:30</label>
              </div>
              <div class="time-slot">
                <input type="checkbox" id="time1300" name="time" value="1300"><label for="time1300">13:00</label>
              </div>
              <div class="time-slot">
                <input type="checkbox" id="time1530" name="time" value="1530"><label for="time1530">15:30</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>音控員 <span class="required">*</span></label>
            <input type="text" id="operator" name="operator" required placeholder="音控員姓名或簡稱">
          </div>

          <div class="form-group">
            <label>備註</label>
            <textarea id="memo" name="memo" rows="2" placeholder="特殊需求或備註（選填）"></textarea>
          </div>

          <div class="form-group">
            <label>記錄者</label>
            <input type="text" id="recorder" name="recorder" placeholder="您的姓名或簡稱">
          </div>

          <button type="submit" class="btn" id="submitBtn">提交預約</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()" style="display: none;" id="cancelBtn">取消編輯</button>
        </form>

        <div class="conflict-section" id="conflictSection" style="display: none;">
          <h3>⚠️ 撞期提示</h3>
          <div id="conflictList"></div>
        </div>
      </div>

      <!-- 月曆顯示 -->
      <div class="calendar-section">
        <div class="calendar-header">
          <div style="display: flex; align-items: center; gap: 15px;">
            <div class="current-month" id="current-month"></div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <label for="monthSelector" style="font-size: 14px; color: #2c3e50;">選擇月份：</label>
              <input type="month" id="monthSelector" style="padding: 8px; border: 2px solid #3498db; border-radius: 6px; font-size: 14px; cursor: pointer;" onchange="changeMonth()" disabled>
              <button type="button" id="monthLockBtn" onclick="toggleMonthLock()" style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">🔒 解鎖</button>
              <button type="button" onclick="reloadBookings()" style="padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;" title="重新載入所有預約資料">🔄 重新載入</button>
              <div id="monthPasswordContainer" style="display: none; align-items: center; gap: 5px;">
                <input type="password" id="monthPassword" placeholder="輸入密碼" style="padding: 6px; border: 2px solid #3498db; border-radius: 4px; font-size: 12px; width: 120px;" onkeypress="if(event.key==='Enter') unlockMonth()">
                <button type="button" onclick="unlockMonth()" style="padding: 6px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">確認</button>
                <button type="button" onclick="cancelUnlock()" style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">取消</button>
              </div>
            </div>
          </div>
          <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background: #e74c3c;"></div><span>A室</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #f39c12;"></div><span>B室</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #27ae60;"></div><span>C室</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #8e44ad;"></div><span>D室</span></div>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // 基本設定與快取
    const STORAGE_KEY = 'recording_studio_bookings';
    const HOLIDAYS_STORAGE_KEY = 'hk_holidays_cache';
    const HOLIDAYS_CACHE_EXPIRY = 24 * 60 * 60 * 1000;
    const TIME_SLOTS = ['0900', '1030', '1300', '1530'];
    const ROOMS = ['A', 'B', 'C', 'D'];
    const PROGRAM_COLORS = [
      '#e74c3c','#f39c12','#27ae60','#8e44ad','#e67e22',
      '#1abc9c','#9b59b6','#34495e','#16a085','#d35400',
      '#c0392b','#27ae60','#f39c12','#e74c3c','#9b59b6',
      '#1abc9c','#16a085','#d35400','#c0392b','#8e44ad',
      '#34495e','#e67e22','#27ae60','#f39c12','#e74c3c',
      '#9b59b6','#1abc9c','#16a085','#d35400','#c0392b'
    ];
    let HK_HOLIDAYS = [];
    let bookingsCache = null, cacheTimestamp = 0;

    const PROGRAM_COLOR_STORAGE_KEY = 'program_colors';
    function getProgramColor(program) {
      if (!program || program.trim() === '') return '#f5f5f5';
      if (program === '維修保養') return '#4C8DDC';
      const colorMap = JSON.parse(localStorage.getItem(PROGRAM_COLOR_STORAGE_KEY) || '{}');
      if (colorMap[program]) return colorMap[program];
      const programs = Object.keys(colorMap);
      const usedColors = Object.values(colorMap);
      let newColor = PROGRAM_COLORS.find(c => !usedColors.includes(c));
      if (!newColor) newColor = PROGRAM_COLORS[programs.length % PROGRAM_COLORS.length];
      colorMap[program] = newColor;
      localStorage.setItem(PROGRAM_COLOR_STORAGE_KEY, JSON.stringify(colorMap));
      return newColor;
    }
    function updateProgramColorPreview() {
      const program = document.getElementById('program').value.trim();
      const preview = document.getElementById('programColorPreview');
      if (program) {
        const color = getProgramColor(program);
        preview.style.background = color;
        preview.style.borderColor = color;
        preview.title = `節目「${program}」將使用此顏色顯示`;
      } else {
        preview.style.background = '#f5f5f5';
        preview.style.borderColor = '#ddd';
        preview.title = '節目顯示顏色';
      }
    }

    // 資料存取：Supabase 優先，localStorage 備援
    async function getBookings() {
      if (window.supabaseApi) {
        return await window.supabaseApi.fetchBookings();
      }
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }
    async function loadHolidaysFromSheet() {
      if (window.supabaseApi) {
        HK_HOLIDAYS = await window.supabaseApi.fetchHolidays();
        localStorage.setItem(HOLIDAYS_STORAGE_KEY, JSON.stringify({ holidays: HK_HOLIDAYS, timestamp: Date.now() }));
        if (document.querySelector('.calendar-grid')) await generateCalendar();
        return;
      }
      const cached = localStorage.getItem(HOLIDAYS_STORAGE_KEY);
      if (cached) {
        try {
          const data = JSON.parse(cached);
          if (Date.now() - data.timestamp < HOLIDAYS_CACHE_EXPIRY) {
            HK_HOLIDAYS = data.holidays || [];
            return;
          }
        } catch (e) {}
      }
      HK_HOLIDAYS = [];
    }
    function clearBookingsCache() { bookingsCache = null; cacheTimestamp = 0; }

    async function reloadBookings() {
      showAlert('正在重新載入預約資料...', 'warning');
      clearBookingsCache();
      const bookings = await getBookings();
      await generateCalendar();
      showAlert(`已重新載入 ${bookings.length} 筆預約資料`, 'success');
    }

    async function addBooking(booking, isRepeat=false, weekday=null, groupId=null, skipReload=false) {
      const uniqueId = Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9) + '-' + performance.now().toString().replace('.', '');
      const newBooking = { id: uniqueId, ...booking, isRepeat, weekday, groupId: groupId || (isRepeat ? Date.now().toString() + '-' + Math.random().toString(36).substr(2, 9) : null), createdAt: new Date().toISOString() };
      if (window.supabaseApi) {
        await window.supabaseApi.upsertBooking(newBooking);
        clearBookingsCache();
        return newBooking;
      }
      const bookings = await getBookings();
      bookings.push(newBooking);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      return newBooking;
    }

    async function updateBooking(id, booking) {
      if (window.supabaseApi) {
        await window.supabaseApi.upsertBooking({ id, ...booking });
        clearBookingsCache();
        return true;
      }
      const bookings = await getBookings();
      const idx = bookings.findIndex(b => b.id === id);
      if (idx !== -1) {
        bookings[idx] = { ...bookings[idx], ...booking };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        return true;
      }
      return false;
    }

    async function deleteBooking(id) {
      if (window.supabaseApi) {
        await window.supabaseApi.deleteBooking(id);
        clearBookingsCache();
        return;
      }
      const bookings = await getBookings();
      const filtered = bookings.filter(b => b.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
    }

    async function deleteRepeatGroup(groupId) {
      if (window.supabaseApi) {
        await window.supabaseApi.deleteGroup(groupId);
        clearBookingsCache();
        return;
      }
      const bookings = await getBookings();
      const filtered = bookings.filter(b => b.groupId !== groupId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
    }

    async function checkConflict(newBooking, excludeId=null) {
      const bookings = await getBookings();
      return bookings.filter(b => {
        if (excludeId && b.id === excludeId) return false;
        if (newBooking.groupId && b.groupId === newBooking.groupId) return false;
        return b.date === newBooking.date && b.room === newBooking.room && b.time === newBooking.time;
      });
    }

    // UI / 共用
    function showAlert(message, type='success') {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} show`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
      setTimeout(() => {
        alert.classList.remove('show');
        setTimeout(() => alert.remove(), 300);
      }, 3000);
    }
    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 月曆 & 表單流程
    let currentDate = new Date();
    const MONTH_STORAGE_KEY = 'selected_month';
    const MONTH_PASSWORD = 'admin2025';
    const MONTH_UNLOCK_KEY = 'month_unlocked';
    let isMonthUnlocked = false;

    function checkMonthUnlock() {
      const unlocked = sessionStorage.getItem(MONTH_UNLOCK_KEY);
      if (unlocked === 'true') {
        isMonthUnlocked = true;
        document.getElementById('monthSelector').disabled = false;
        document.getElementById('monthLockBtn').textContent = '🔓 已解鎖';
        document.getElementById('monthLockBtn').style.background = '#27ae60';
        document.getElementById('monthPasswordContainer').style.display = 'none';
      } else {
        isMonthUnlocked = false;
        document.getElementById('monthSelector').disabled = true;
        document.getElementById('monthLockBtn').textContent = '🔒 解鎖';
        document.getElementById('monthLockBtn').style.background = '#95a5a6';
      }
    }
    function toggleMonthLock() {
      if (isMonthUnlocked) {
        isMonthUnlocked = false;
        sessionStorage.removeItem(MONTH_UNLOCK_KEY);
        document.getElementById('monthSelector').disabled = true;
        document.getElementById('monthLockBtn').textContent = '🔒 解鎖';
        document.getElementById('monthLockBtn').style.background = '#95a5a6';
        document.getElementById('monthPasswordContainer').style.display = 'none';
      } else {
        document.getElementById('monthPasswordContainer').style.display = 'flex';
        document.getElementById('monthPassword').focus();
      }
    }
    function unlockMonth() {
      const password = document.getElementById('monthPassword').value;
      if (password === MONTH_PASSWORD) {
        isMonthUnlocked = true;
        sessionStorage.setItem(MONTH_UNLOCK_KEY, 'true');
        document.getElementById('monthSelector').disabled = false;
        document.getElementById('monthLockBtn').textContent = '🔓 已解鎖';
        document.getElementById('monthLockBtn').style.background = '#27ae60';
        document.getElementById('monthPasswordContainer').style.display = 'none';
        document.getElementById('monthPassword').value = '';
        showAlert('月份選擇已解鎖', 'success');
      } else {
        showAlert('密碼錯誤', 'danger');
        document.getElementById('monthPassword').value = '';
        document.getElementById('monthPassword').focus();
      }
    }
    function cancelUnlock() {
      document.getElementById('monthPasswordContainer').style.display = 'none';
      document.getElementById('monthPassword').value = '';
    }

    function loadSavedMonth() {
      const saved = localStorage.getItem(MONTH_STORAGE_KEY);
      if (saved) {
        const [year, month] = saved.split('-');
        currentDate = new Date(parseInt(year), parseInt(month) - 1, 1);
      }
      updateMonthSelector();
    }
    function updateMonthSelector() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      document.getElementById('monthSelector').value = `${year}-${month}`;
    }
    async function changeMonth() {
      if (!isMonthUnlocked) {
        showAlert('請先解鎖月份選擇功能', 'warning');
        updateMonthSelector();
        return;
      }
      const monthValue = document.getElementById('monthSelector').value;
      if (monthValue) {
        const [year, month] = monthValue.split('-');
        currentDate = new Date(parseInt(year), parseInt(month) - 1, 1);
        localStorage.setItem(MONTH_STORAGE_KEY, monthValue);
        await generateCalendar();
        updateDefaultBookingDate();
        const bookingType = document.getElementById('bookingType').value;
        if (bookingType === 'repeat') generateDateButtons();
        showAlert(`已切換到 ${year}年${parseInt(month)}月`, 'success');
      }
    }

    function updateDefaultBookingDate() {
      const today = new Date();
      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();
      let defaultDate;
      if (today.getFullYear() === currentYear && today.getMonth() === currentMonth) defaultDate = today;
      else defaultDate = new Date(currentYear, currentMonth, 1);
      document.getElementById('bookingDate').value = formatDate(defaultDate);
    }

    function toggleRepeatOptions() {
      const bookingType = document.getElementById('bookingType').value;
      const singleDateGroup = document.getElementById('singleDateGroup');
      const repeatGroup = document.getElementById('repeatGroup');
      const repeatOptions = document.getElementById('repeatOptions');
      if (bookingType === 'repeat') {
        singleDateGroup.style.display = 'none';
        repeatGroup.style.display = 'block';
        repeatOptions.classList.add('show');
        document.getElementById('bookingDate').removeAttribute('required');
        document.getElementById('weekday').setAttribute('required','required');
      } else {
        singleDateGroup.style.display = 'block';
        repeatGroup.style.display = 'none';
        repeatOptions.classList.remove('show');
        document.getElementById('bookingDate').setAttribute('required','required');
        document.getElementById('weekday').removeAttribute('required');
        clearDateButtons();
      }
    }

    function generateDateButtons() {
      const weekday = document.getElementById('weekday').value;
      if (!weekday) { clearDateButtons(); return; }
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const targetWeekday = parseInt(weekday); // 1=一,...,6=六
      const dates = [];
      for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, month, day);
        if (date.getDay() === targetWeekday) dates.push(date);
      }
      const container = document.getElementById('dateSelectionContainer');
      container.innerHTML = '';
      if (dates.length === 0) {
        container.innerHTML = '<p style="font-size: 12px; color: #7f8c8d;">該月沒有對應的日期</p>';
        return;
      }
      dates.forEach(date => {
        const dateStr = formatDate(date);
        const isHoliday = HK_HOLIDAYS.includes(dateStr);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `date-btn ${isHoliday ? 'holiday' : ''}`;
        btn.dataset.date = dateStr;
        btn.textContent = `${date.getMonth() + 1}/${date.getDate()}`;
        btn.onclick = function() {
          this.classList.toggle('selected');
          updateConflictDisplay();
        };
        container.appendChild(btn);
      });
    }
    function clearDateButtons() {
      const container = document.getElementById('dateSelectionContainer');
      container.innerHTML = '<p style="font-size: 12px; color: #7f8c8d;">請先選擇「每週」的星期</p>';
    }
    function getSelectedDates() {
      const selectedButtons = document.querySelectorAll('.date-btn.selected');
      return Array.from(selectedButtons).map(btn => btn.dataset.date);
    }

    function resetForm() {
      document.getElementById('bookingForm').reset();
      document.getElementById('editingId').value = '';
      document.getElementById('submitBtn').textContent = '提交預約';
      document.getElementById('cancelBtn').style.display = 'none';
      clearDateButtons();
      document.getElementById('bookingType').value = 'single';
      toggleRepeatOptions();
      updateDefaultBookingDate();
      updateConflictDisplay();
    }

    async function editBooking(id) {
      const bookings = await getBookings();
      const booking = bookings.find(b => b.id === id);
      if (!booking) return;
      document.getElementById('editingId').value = id;
      document.getElementById('program').value = booking.program;
      updateProgramColorPreview();
      document.getElementById('room').value = booking.room;
      document.getElementById('operator').value = booking.operator;
      document.getElementById('memo').value = booking.memo || '';
      document.getElementById('recorder').value = booking.recorder || '';
      if (booking.isRepeat && booking.weekday && booking.groupId) {
        document.getElementById('bookingType').value = 'repeat';
        document.getElementById('weekday').value = booking.weekday;
        toggleRepeatOptions();
        generateDateButtons();
        const groupBookings = bookings.filter(b => b.groupId === booking.groupId);
        const groupTimes = [...new Set(groupBookings.map(b => b.time))];
        groupBookings.forEach(b => {
          const btn = document.querySelector(`.date-btn[data-date="${b.date}"]`);
          if (btn) btn.classList.add('selected');
        });
        TIME_SLOTS.forEach(time => {
          document.getElementById(`time${time}`).checked = groupTimes.includes(time);
        });
      } else {
        document.getElementById('bookingType').value = 'single';
        document.getElementById('bookingDate').value = booking.date;
        toggleRepeatOptions();
        TIME_SLOTS.forEach(time => {
          document.getElementById(`time${time}`).checked = booking.time === time;
        });
      }
      document.getElementById('submitBtn').textContent = '更新預約';
      document.getElementById('cancelBtn').style.display = 'block';
      updateConflictDisplay();
      document.querySelector('.booking-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function updateConflictDisplay() {
      const formData = new FormData(document.getElementById('bookingForm'));
      const bookingType = formData.get('bookingType');
      const room = formData.get('room');
      const times = formData.getAll('time');
      const editingId = document.getElementById('editingId').value;
      if (!room || times.length === 0) {
        document.getElementById('conflictSection').style.display = 'none';
        return;
      }
      let dates = [];
      if (bookingType === 'repeat') dates = getSelectedDates();
      else {
        const date = formData.get('bookingDate');
        if (date) dates = [date];
      }
      if (dates.length === 0) {
        document.getElementById('conflictSection').style.display = 'none';
        return;
      }
      let excludeGroupId = null;
      if (editingId) {
        const bookings = await getBookings();
        const editingBooking = bookings.find(b => b.id === editingId);
        if (editingBooking && editingBooking.isRepeat && editingBooking.groupId) excludeGroupId = editingBooking.groupId;
      }
      const conflicts = [];
      for (const date of dates) {
        for (const time of times) {
          const booking = { date, room, time };
          const conflictList = await checkConflict(booking, editingId || null);
          conflictList.forEach(c => {
            if (excludeGroupId && c.groupId === excludeGroupId) return;
            conflicts.push({ date: c.date, room: c.room, time: c.time, program: c.program });
          });
        }
      }
      const conflictSection = document.getElementById('conflictSection');
      const conflictList = document.getElementById('conflictList');
      if (conflicts.length > 0) {
        conflictSection.style.display = 'block';
        conflictList.innerHTML = conflicts.map(c =>
          `<div class="conflict-item">${c.date} ${c.room}室 ${c.time} 已被 ${c.program} 預約</div>`
        ).join('');
      } else {
        conflictSection.style.display = 'none';
      }
    }

    async function generateCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      let startDate = new Date(firstDay);
      const firstDayOfWeek = firstDay.getDay();
      const daysToMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
      startDate.setDate(startDate.getDate() - daysToMonday);

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const weekdays = ['一','二','三','四','五','六'];
      weekdays.forEach(day => {
        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = day;
        grid.appendChild(header);
      });

      const today = new Date(); today.setHours(0,0,0,0);
      const bookings = await getBookings();

      for (let week = 0; week < 6; week++) {
        for (let day = 0; day < 6; day++) {
          const date = new Date(startDate);
          date.setDate(startDate.getDate() + (week * 7 + day));
          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          const dateOnly = new Date(date); dateOnly.setHours(0,0,0,0);
          if (dateOnly.getTime() === today.getTime()) dayCell.classList.add('today');

          const dateStr = formatDate(date);
          const dayOfWeek = date.getDay();
          const isSaturday = dayOfWeek === 6;
          if (HK_HOLIDAYS.includes(dateStr)) dayCell.classList.add('holiday');
          if (date.getMonth() !== month) dayCell.classList.add('other-month');

          const dayNumber = document.createElement('div');
          dayNumber.className = 'day-number';
          dayNumber.textContent = date.getDate();
          dayCell.appendChild(dayNumber);

          if (isSaturday) {
            dayCell.classList.add('saturday');
            const dayBookings = bookings.filter(b => (b.date ? String(b.date).trim() : '') === dateStr);
            if (dayBookings.length > 0) {
              dayBookings.sort((a, b) => {
                if (a.room !== b.room) return a.room.localeCompare(b.room);
                return a.time.localeCompare(b.time);
              });
              const saturdayContainer = document.createElement('div');
              saturdayContainer.className = 'saturday-bookings';
              dayBookings.forEach(booking => {
                const item = document.createElement('div');
                const color = getProgramColor(booking.program);
                item.className = 'saturday-booking-item';
                item.style.background = color;
                item.style.color = 'white';
                const displayText = `${booking.room}-${booking.time}, ${booking.program}${booking.program !== '維修保養' ? ', ' + booking.operator : ''}`;
                item.textContent = displayText;
                item.title = `節目：${booking.program}\n音控員：${booking.operator}\n${booking.memo ? '備註：' + booking.memo : ''}`;
                const actions = document.createElement('div');
                actions.className = 'booking-actions';
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn edit-btn';
                editBtn.textContent = '✎';
                editBtn.onclick = (e) => { e.stopPropagation(); editBooking(booking.id); };
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn delete-btn';
                deleteBtn.textContent = '×';
                deleteBtn.onclick = async (e) => {
                  e.stopPropagation();
                  if (booking.isRepeat && booking.groupId) {
                    const bookings = await getBookings();
                    const groupCount = bookings.filter(b => b.groupId === booking.groupId).length;
                    if (confirm(`這是每週重複預約的一部分（共${groupCount}個預約）。\n確定要刪除整個每週重複預約嗎？`)) {
                      await deleteRepeatGroup(booking.groupId);
                      await generateCalendar();
                      updateConflictDisplay();
                      showAlert('每週重複預約已全部刪除', 'success');
                    }
                  } else {
                    if (confirm('確定要刪除此預約嗎？')) {
                      await deleteBooking(booking.id);
                      await generateCalendar();
                      updateConflictDisplay();
                      showAlert('預約已刪除', 'success');
                    }
                  }
                };
                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                item.appendChild(actions);
                saturdayContainer.appendChild(item);
              });
              dayCell.appendChild(saturdayContainer);
            }
          } else {
            const table = document.createElement('table');
            table.className = 'time-table';
            const headerRow = document.createElement('tr');
            const timeHeader = document.createElement('td');
            timeHeader.className = 'time-label';
            timeHeader.textContent = '時段';
            timeHeader.style.background = '#4B7970';
            timeHeader.style.color = 'white';
            headerRow.appendChild(timeHeader);
            const roomColors = { 'A': '#ffcdd2','B': '#ffe0b2','C': '#c8e6c9','D': '#e1bee7' };
            ROOMS.forEach(room => {
              const roomHeader = document.createElement('td');
              roomHeader.className = 'room-cell';
              roomHeader.textContent = room;
              roomHeader.style.background = roomColors[room];
              roomHeader.style.fontWeight = 'bold';
              headerRow.appendChild(roomHeader);
            });
            table.appendChild(headerRow);
            TIME_SLOTS.forEach(time => {
              const row = document.createElement('tr');
              const timeCell = document.createElement('td');
              timeCell.className = 'time-label';
              timeCell.textContent = time.substring(0,2) + ':' + time.substring(2);
              if (time === '1030' || time === '1530') timeCell.style.background = '#e0e0e0';
              row.appendChild(timeCell);
              ROOMS.forEach(room => {
                const cell = document.createElement('td');
                cell.className = 'room-cell';
                const dayBookings = bookings.filter(b => {
                  let bookingDate = b.date ? String(b.date).trim() : '';
                  if (bookingDate.includes('T')) bookingDate = bookingDate.split('T')[0];
                  let bookingTime = b.time;
                  if (typeof bookingTime === 'number') bookingTime = String(bookingTime).padStart(4,'0');
                  else bookingTime = (bookingTime || '').toString().trim().padStart(4,'0');
                  return bookingDate === dateStr && b.room === room && bookingTime === time;
                });
                if (dayBookings.length > 0) {
                  const booking = dayBookings[0];
                  const color = getProgramColor(booking.program);
                  cell.className = 'room-cell booked';
                  cell.style.background = color;
                  cell.style.color = 'white';
                  cell.textContent = booking.program === '維修保養'
                    ? booking.program
                    : `${booking.program}--${booking.operator}`;
                  cell.title = `節目：${booking.program}\n音控員：${booking.operator}\n${booking.memo ? '備註：' + booking.memo : ''}`;
                  const actions = document.createElement('div');
                  actions.className = 'booking-actions';
                  const editBtn = document.createElement('button');
                  editBtn.className = 'action-btn edit-btn';
                  editBtn.textContent = '✎';
                  editBtn.onclick = (e) => { e.stopPropagation(); editBooking(booking.id); };
                  const deleteBtn = document.createElement('button');
                  deleteBtn.className = 'action-btn delete-btn';
                  deleteBtn.textContent = '×';
                  deleteBtn.onclick = async (e) => {
                    e.stopPropagation();
                    if (booking.isRepeat && booking.groupId) {
                      const bookings = await getBookings();
                      const groupCount = bookings.filter(b => b.groupId === booking.groupId).length;
                      if (confirm(`這是每週重複預約的一部分（共${groupCount}個預約）。\n確定要刪除整個每週重複預約嗎？`)) {
                        await deleteRepeatGroup(booking.groupId);
                        await generateCalendar();
                        updateConflictDisplay();
                        showAlert('每週重複預約已全部刪除', 'success');
                      }
                    } else {
                      if (confirm('確定要刪除此預約嗎？')) {
                        await deleteBooking(booking.id);
                        await generateCalendar();
                        updateConflictDisplay();
                        showAlert('預約已刪除', 'success');
                      }
                    }
                  };
                  actions.appendChild(editBtn);
                  actions.appendChild(deleteBtn);
                  cell.appendChild(actions);
                }
                row.appendChild(cell);
              });
              table.appendChild(row);
            });
            dayCell.appendChild(table);
          }
          grid.appendChild(dayCell);
        }
      }
      document.getElementById('current-month').textContent = `${year}年${month + 1}月`;
    }

    // 表單提交
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const bookingType = formData.get('bookingType');
      const times = formData.getAll('time');
      const editingId = document.getElementById('editingId').value;
      if (times.length === 0) { showAlert('請至少選擇一個時段','danger'); return; }
      const program = formData.get('program');
      const room = formData.get('room');
      const operator = formData.get('operator');
      const memo = formData.get('memo') || '';
      const recorder = formData.get('recorder') || '';
      let dates = [];
      if (bookingType === 'repeat') {
        const weekday = formData.get('weekday');
        if (!weekday) { showAlert('請選擇每週的星期','danger'); return; }
        dates = getSelectedDates();
        if (dates.length === 0) { showAlert('請至少選擇一個日期','danger'); return; }
      } else {
        const date = formData.get('bookingDate');
        if (!date) { showAlert('請選擇預約日期','danger'); return; }
        dates = [date];
      }

      let hasConflict = false;
      const conflictMessages = [];
      let successCount = 0;
      let groupId = null;
      if (editingId) {
        const bookings = await getBookings();
        const editingBooking = bookings.find(b => b.id === editingId);
        if (editingBooking) {
          if (editingBooking.isRepeat && editingBooking.groupId) {
            if (bookingType === 'repeat') {
              groupId = editingBooking.groupId;
              const oldGroupBookings = bookings.filter(b => b.groupId === groupId);
              for (const b of oldGroupBookings) await deleteBooking(b.id);
            } else {
              const oldGroupBookings = bookings.filter(b => b.groupId === editingBooking.groupId);
              for (const b of oldGroupBookings) await deleteBooking(b.id);
            }
          } else {
            await deleteBooking(editingId);
          }
        }
      }
      if (bookingType === 'repeat' && !groupId) groupId = Date.now().toString();

      for (const date of dates) {
        for (const time of times) {
          const booking = { program, date, room, time, operator, memo, recorder };
          const conflicts = await checkConflict(booking, editingId || null);
          if (conflicts.length > 0) {
            hasConflict = true;
            conflicts.forEach(conflict => conflictMessages.push(`${date} ${room}室 ${time} 時段已有預約（${conflict.program}）`));
          }
        }
      }
      if (!hasConflict) {
        const bookingsToAdd = [];
        for (const date of dates) {
          for (const time of times) {
            bookingsToAdd.push({
              booking: { program, date, room, time, operator, memo, recorder },
              isRepeat: bookingType === 'repeat',
              weekday: bookingType === 'repeat' ? formData.get('weekday') : null,
              groupId
            });
          }
        }
        for (const item of bookingsToAdd) {
          await addBooking(item.booking, item.isRepeat, item.weekday, item.groupId, true);
          successCount++;
        }
        clearBookingsCache();
        const allBookings = await getBookings();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allBookings));
      }
      if (hasConflict && successCount === 0) showAlert('所有時段都發生撞期：\n' + conflictMessages.join('\n'), 'warning');
      else if (hasConflict) showAlert(`部分預約成功（${successCount}個），部分時段發生撞期`, 'warning');
      else { showAlert(editingId ? '預約已更新！' : `預約成功！已建立 ${successCount} 個預約`, 'success'); resetForm(); }

      clearBookingsCache();
      await generateCalendar();
      updateConflictDisplay();
    });

    ['bookingDate','room'].forEach(id => {
      const element = document.getElementById(id);
      if (element) element.addEventListener('change', updateConflictDisplay);
    });
    document.querySelectorAll('input[name="time"]').forEach(checkbox => {
      checkbox.addEventListener('change', updateConflictDisplay);
    });
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('date-btn')) updateConflictDisplay();
    });

    document.addEventListener('DOMContentLoaded', async function() {
      loadSavedMonth();
      updateDefaultBookingDate();
      checkMonthUnlock();
      clearBookingsCache();
      console.log('初始化：清除快取，準備載入所有預約資料');
      loadHolidaysFromSheet().then(async () => {
        if (document.querySelector('.calendar-grid')) await generateCalendar();
      });
      await generateCalendar();
      document.getElementById('weekday').addEventListener('change', generateDateButtons);
      document.getElementById('program').addEventListener('input', updateProgramColorPreview);
    });
  </script>
</body>
</html>
